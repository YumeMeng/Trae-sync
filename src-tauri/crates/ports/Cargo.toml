[package]
name = "traesync-ports"
version = "0.1.0"
edition = "2021"

# ports 只依赖 domain，不依赖 application/infrastructure/commands/tauri。
[dependencies]
traesync-domain = { path = "../domain" }
# remote_device 端口（ADR-0031）：快照结构需 Serialize 供前端 DTO 使用；
# LastActiveAt 原样保留服务端 JSON 值（字符串/数字双形态）需要 serde_json::Value。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
